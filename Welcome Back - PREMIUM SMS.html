<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,sans-serif;background:#f8fafc;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}

<p class="sub">Please enter your details to sign in.</p>
<label>Email Address</label>
<input id="email" placeholder="name@company.com">

<input id="pass" type="password" placeholder="••••••••">

<div class="or">or</div>
<p style="text-align:center;font-size:13px;color:#64748b">Don't have an account? <a href="/signup" class="link">Create one</a></p>
</div>
<script>

  const email=document.getElementById('email').value||'user@example.com';
  const user={email:email,firstName:email.split('@')[0],balance:'0.00',api_key:'ffcc751480b3c67244ea7123acbeb608'};
  localStorage.setItem('premium_user',JSON.stringify(user));

}
