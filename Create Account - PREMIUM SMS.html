</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account - PREMIUM SMS</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.card{background:#fff;width:100%;max-width:440px;border-radius:24px;border:1px solid #e2e8f0;padding:32px 28px;box-shadow:0 10px 30px rgba(0,0,0,0.05)}h1{text-align:center;font-size:36px;font-weight:900;letter-spacing:-0.5px;color:#0f172a}.sub{text-align:center;color:#64748b;margin:10px 0 28px;font-size:15px}.row{display:flex;gap:12px}.field{margin-bottom:18px;flex:1}.label{font-weight:700;font-size:14px;color:#0f172a;margin-bottom:8px;display:block}.input{width:100%;padding:14px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;outline:none;transition:0.2s}.input:focus{border-color:#2563eb}.input::placeholder{color:#94a3b8}.strength{height:4px;background:#f1f5f9;border-radius:10px;margin-top:10px;overflow:hidden}.bar{width:50%;height:100%;background:#f59e0b;border-radius:10px}.check{display:flex;gap:10px;align-items:flex-start;margin:20px 0;font-size:14px;color:#475569;line-height:1.4}.check input{margin-top:2px;width:18px;height:18px}.check a{color:#2563eb;text-decoration:none;font-weight:600}.btn{width:100%;background:#2563eb;color:#fff;border:none;padding:16px;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}.foot{text-align:center;margin-top:22px;color:#64748b;font-size:14px}.foot a{color:#2563eb;font-weight:800;text-decoration:none}</style></head><body><div class="card"><h1>Create Account</h1><div class="sub">Join thousands of users today.</div><div class="row"><div class="field"><label class="label">First Name</label><input class="input" placeholder="John" id="fn"></div><div class="field"><label class="label">Last Name</label><input class="input" placeholder="Doe" id="ln"></div></div><div class="field" style="margin-top:4px"><label class="label">Email Address</label><input class="input" placeholder="john@example.com" id="email" type="email"></div><div class="field"><label class="label">Password</label><input class="input" placeholder="••••••••" id="pass" type="password"><div class="strength"><div class="bar"></div></div></div><div class="check"><input type="checkbox" id="agree"><label for="agree">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label></div><button class="btn" onclick="createAcc()">Create My Account</button><div class="foot">Already have an account? <a href="login.html">Log in</a></div></div><script src="config.js"></script><script>function createAcc(){const fn=document.getElementById('fn').value,ln=document.getElementById('ln').value,e=document.getElementById('email').value,p=document.getElementById('pass').value,ag=document.getElementById('agree').checked;if(!fn||!ln||!e||!p){alert('All fields required');return}if(!ag){alert('Please agree to Terms');return}localStorage.setItem('premium_user',JSON.stringify({firstName:fn,lastName:ln,email:e,password:p}));alert('Account created! Now login with same email/pass');location.href='login.html'}</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(u
